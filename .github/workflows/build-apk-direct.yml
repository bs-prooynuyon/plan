name: Build APK (GitHub, Expo hesabı gerekmez)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install expo-notifications expo-auth-session expo-crypto expo-secure-store expo-keep-awake expo-battery expo-print expo-sharing expo-file-system expo-document-picker

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Planim-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
